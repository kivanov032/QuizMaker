version: '3.8'

services:
  nginx-proxy:
    image: nginx:alpine
    ports:
      - "80:80"
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - quiz-service
      - user-service
      - react-service

  quiz-service:
    build: ./quiz
    expose:
      - "9000"
    environment:
      - APP_ENV=production
      - APP_URL=http://nginx-proxy:8000
      - DATABASE_URL=pgsql://postgres:sapass@postgres:5432/Users_QM
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9000 || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 3

  user-service:
    build: ./user
    expose:
      - "9000"
    environment:
      - APP_ENV=production
      - APP_URL=http://nginx-proxy:8001
      - DATABASE_URL=pgsql://postgres:sapass@postgres:5432/Users_QM
      - KAFKA_BROKERS=kafka:9092
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9000 || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 3

  react-service:
    build: ./react
    environment:
      - REACT_APP_API_URL=http://localhost

  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: sapass
      POSTGRES_DB: Users_QM
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]

  redis:
    image: redis:7
    command: redis-server --requirepass redispass

  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_NUM_PARTITIONS: 3
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper


  zookeeper:
    image: bitnami/zookeeper:3.9

volumes:
  postgres-data:

networks:
  default:
    driver: bridge
