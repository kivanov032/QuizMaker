version: '3.8'

services:
  quiz-service:
    build:
      context: ./quiz
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - ./quiz:/app
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: Quizzes_QM
      DB_USERNAME: postgres
      DB_PASSWORD: sapass
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - qm-network

  user-service:
    build:
      context: ./user
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./user:/app
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: Users_QM
      DB_USERNAME: postgres
      DB_PASSWORD: sapass
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - qm-network

  react-service:
    build:
      context: ./react
      dockerfile: Dockerfile
    tty: true
    ports:
      - "3000:3000"
    volumes:
      - ./react:/app
    environment:
      - VITE_USER_API_BASE_URL=http://user-service:8000
      - VITE_QUIZ_API_BASE_URL=http://quiz-service:8001
    depends_on:
      - quiz-service
      - user-service
    networks:
      - qm-network

  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: sapass
      POSTGRES_USER: postgres
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - qm-network


  redis:
    image: redis:7
    command: redis-server --requirepass redispass
    ports:
      - "6379:6379"
    networks:
      - qm-network

  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    networks:
      - qm-network

  zookeeper:
    image: bitnami/zookeeper:3.9
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"
    networks:
      - qm-network

volumes:
  postgres-data:

networks:
  qm-network:
    driver: bridge
